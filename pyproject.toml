[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-quality"
version = "0.1.0"
description = "Doc Quality Gate engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="EOFFR Docs-as-Code", email="noreply@example.com"}]
license = {text="Proprietary"}
dependencies = [
  "PyYAML>=6.0.1",
  "markdown-it-py>=3.0.0",
  "jsonschema>=4.22.0",
  "httpx>=0.27.0",
]

[project.scripts]
doc-quality = "doc_quality.cli:main"

[tool.setuptools.packages.find]
include = ["doc_quality*"]
